<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>

<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f0f0f0;
  font-family: Arial;
}

.calculator {
  width: 300px;
  padding: 15px;
  border: 2px solid #aaa;
  border-radius: 10px;
  background: #fff;
}

#display {
  width: 100%;
  height: 60px;
  background: #3b6b95;
  color: white;
  font-size: 30px;
  text-align: right;
  padding: 10px;
  border: none;
  margin-bottom: 10px;
  border-radius: 5px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

button {
  padding: 15px;
  font-size: 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

/* Number buttons */
.num {
  background: #a9bdd0;
}

/* Operator buttons */
.op {
  background: #eee;
}

/* Special buttons */
.equal {
  background: #6c8fae;
  color: white;
}

.ac {
  background: #6c8fae;
  color: white;
}
</style>
</head>

<body>

<div class="calculator">
  <input type="text" id="display" value="0" disabled>

  <div class="buttons">
    <button class="num" onclick="press('7')">7</button>
    <button class="num" onclick="press('8')">8</button>
    <button class="num" onclick="press('9')">9</button>
    <button class="op" onclick="press('+')">+</button>
    <button class="op" onclick="back()">Back</button>

    <button class="num" onclick="press('4')">4</button>
    <button class="num" onclick="press('5')">5</button>
    <button class="num" onclick="press('6')">6</button>
    <button class="op" onclick="press('-')">-</button>
    <button class="op" onclick="calculate()">Ans</button>

    <button class="num" onclick="press('1')">1</button>
    <button class="num" onclick="press('2')">2</button>
    <button class="num" onclick="press('3')">3</button>
    <button class="op" onclick="press('*')">×</button>
    <button class="op">M+</button>

    <button class="num" onclick="press('0')">0</button>
    <button class="num" onclick="press('.')">.</button>
    <button class="op">EXP</button>
    <button class="op" onclick="press('/')">/</button>
    <button class="op">M-</button>

    <button class="op" onclick="plusMinus()">±</button>
    <button class="op">RND</button>
    <button class="ac" onclick="clearDisplay()">AC</button>
    <button class="equal" onclick="calculate()">=</button>
    <button class="op">MR</button>
  </div>
</div>

<script>
let display = document.getElementById("display");

function press(val) {
  if (display.value === "0") {
    display.value = val;
  } else {
    display.value += val;
  }
}

function calculate() {
  try {
    display.value = eval(display.value);
  } catch {
    display.value = "Error";
  }
}

function clearDisplay() {
  display.value = "0";
}

function back() {
  display.value = display.value.slice(0, -1) || "0";
}

function plusMinus() {
  display.value = String(-Number(display.value));
}
</script>

</body>
</html>
