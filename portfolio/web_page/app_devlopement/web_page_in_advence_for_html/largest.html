<!DOCTYPE html>
<html>
    <head>
        <title>Largest Number</title>
        <style>
            body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);  
            }
            h1 {
    color: #fff;
            }
            input {
    padding: 10px;
            }
        </style>
        
    </head>
    <body>
        <h1>Find the Largest Number</h1>
        <p>Enter three numbers to find out which one is the largest.</p>
        <input type="number" id="num1" placeholder="First Number">
        <br><br>
        <input type="number" id="num2" placeholder="Second Number">
        <br><br>
        <input type="number" id="num3" placeholder="Third Number">
        <br><br>
        <button onclick="findLargest()">Find Largest</button>
        <br><br>
        <p id="result"></p>

        <script>
            function findLargest() {
                const num1 = parseFloat(document.getElementById('num1').value);
                const num2 = parseFloat(document.getElementById('num2').value);
                const num3 = parseFloat(document.getElementById('num3').value);

                if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
                    document.getElementById('result').textContent = 'Please enter valid numbers.';
                    return;
                }

                let largest = num1;

                if (num2 > largest) {
                    largest = num2;
                }
                if (num3 > largest) {
                    largest = num3;
                }

                document.getElementById('result').textContent = 'The largest number is: ' + largest;
            }
        </script>
</html>
