<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Formatting Example</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f8ff;
            text-align: center;
        }

        h1 {
            color: darkblue;
            text-transform: uppercase;
        }

        p {
            font-size: 18px;
        }

        .box {
            border: 2px solid black;
            padding: 20px;
            margin: 30px;
            background-color: white;
            border-radius: 10px;
        }

        .highlight {
            color: red;
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- Heading -->
        <h1>Welcome to My Website</h1>

        <!-- Paragraph -->
        <p>This webpage demonstrates <strong>HTML formatting tags</strong> with styling.</p>

        <!-- Line Break -->
        <p>
            This is first line <br>
            This is second line <br>
            This is third line
        </p>

        <!-- Bold + Strong -->
        <p>
            <b>This is bold text</b> and 
            <strong class="highlight">this is strong important text</strong>.
        </p>

        <!-- Italic -->
        <p>
            <i>This text is italic style.</i>
        </p>

        <!-- Underline -->
        <p>
            <u>This text is underlined.</u>
        </p>

        <!-- Mixed Formatting -->
        <p>
            <b><i><u>All formatting tags combined together!</u></i></b>
        </p>

    </div>

</body>
</html>
