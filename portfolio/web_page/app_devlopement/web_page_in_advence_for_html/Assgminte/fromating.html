<html>
    <head>
        <title>Formatting Examples</title>
    </head>
    <body>
        <h1>Welcome to my website</h1>
        <p>This is a simple web page to demonstrate HTML formatting</p>
        <p>This is first line. <br>This is second line after a line break.</p>
        <p><b>This text is bold using b tag.</b></p>
        <p><i>This text is italic.</i></p>
        <p><u>This text is underlined.</u></p>
        <p><strong>This text is important(strong tag) </strong></p>
    </body>
</html>
