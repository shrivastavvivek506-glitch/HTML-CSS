<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #bbb;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .gender {
            width: auto;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration 🧑‍🎓</h1>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter email" required>

        <label>Mobile Number</label>
        <input type="tel" placeholder="Enter mobile number">

        <label>Date of Birth</label>
        <input type="date">

        <label>Gender</label>

        <input class="gender" type="radio" name="gender"> Male
        <input class="gender" type="radio" name="gender"> Female

        <label>Course</label>

        <select>
            <option>Select Course</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Tech</option>
            <option>MCA</option>
        </select>

        <label>Address</label>

        <textarea rows="4" placeholder="Enter your address"></textarea>

        <button type="submit">Register Now</button>

    </form>

</div>

</body>
</html>
