<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced HTML</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #eef2ff
        }

        header,
        footer {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center
        }

        main {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 8px
        }
    </style>
</head>

<body>
    <header>
        <h1>My Portfolio</h1>
    </header>

    <main>
        <h2>Contact Me</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" minlength="6" required>
            <button>click me</button>
            <p>
                lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quidem.
            </p>
        </form>
    </main>

    <footer>© 2026 My Website</footer>
</body>

</html>
