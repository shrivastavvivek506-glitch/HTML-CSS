<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff5ee;
}

.login-box{
  width:360px;
  background:white;
  padding:35px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.logo{
  font-size:42px;
  font-weight:bold;
  color:#fc8019;
  margin-bottom:10px;
}

h2{
  margin-bottom:25px;
  color:#333;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#fc8019;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#e56f10;
}

.links{
  margin-top:20px;
  font-size:14px;
}

.links a{
  text-decoration:none;
  color:#fc8019;
}
</style>
</head>
<body>

  <div class="login-box">

  <div class="logo">Website</div>

  <h2>Login to Website 🌐</h2>

  <input type="text" id="mobile" placeholder="Phone Number">

  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">LOGIN</button>

  <div class="links">
    New user?
    <a href="#">Sign Up</a>
  </div>
  

</body>
</html>
