<!DOCTYPE html>
<html>
<head>
    <title>My Page</title>

    <!-- CSS goes inside the style tag -->
    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
        }

        button {
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Hello World</h1>
    <button onclick="showMessage()">Click Me</button>

    <!-- JavaScript goes inside script tag -->
    <script>
        function showMessage() {
            alert("Button clicked!");
        }
    </script>

</body>
</html>
