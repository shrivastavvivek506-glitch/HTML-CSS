<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Background Website</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;

      /* 3D Background Image */
      background: url('your-3d-image.jpg') no-repeat center center/cover;
      height: 100vh;
      color: white;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.5); /* dark overlay for readability */
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin: 0;
    }

    p {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div>
      <h1>Welcome to My Website</h1>
      <p>Modern 3D Background Design</p>
    </div>
  </div>

</body>
</html>
