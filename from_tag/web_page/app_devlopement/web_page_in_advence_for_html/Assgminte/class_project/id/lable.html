<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label</title>
</head>
<body>
    <h2>Label Example</h2>
    <p>Click the button to see the label in action:</p>
    <label for="name">Enter the name:</label>
    <input type="text" placeholder="Name" id="name">

    <br>
    <button onclick="click" >click</button>

    <ol>
        <li>BCA</li>
        <li>MCA</li>
        <ul>
            <li>1st year</li>
            <li>2nd year</li>
            <li>3rd year</li>
        </ul>
    </ol>
    BCA:<input type="radio" id="course1" value="course">
    <br>
    
    MCA:<input type="radio" id="course2" value="master">
